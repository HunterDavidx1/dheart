services:
  postgres:
    image: postgres:16-alpine
    container_name: dh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daggerheart
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: daggerheart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
